<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="홍길동 ♥ 김미래 결혼식에 초대합니다">
    <meta property="og:description" content="2026년 5월 23일 토요일 오후 12시">
    <meta property="og:image" content="https://hongseungheee.github.io/weddingv2/assets/1.jpeg">
    
    <title>우리의 결혼식에 초대합니다</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,400;1,500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js"></script>
</head>
<body>
    <section class="intro">
        <div class="main-photo">
            <img src="./assets/4.jpeg" alt="메인 사진">
            <div class="overlay"></div>
        </div>
        
        <div class="intro-content">
            <svg class="wedding-svg" viewBox="0 0 400 100">
                <text x="50%" y="60%" text-anchor="middle" class="svg-text">Wedding Day</text>
            </svg>
            
            <div class="intro-details fade-in-delayed">
                <p class="main-date">2026. 05. 23. SAT PM 12:00</p>
                <p class="main-location">그랜드 하얏트 서울, 그랜드 볼룸</p>
            </div>
        </div>
    </section>

    <section class="invitation fade-in">
        <div class="gold-line"></div>
        <h2 class="serif">INVITATION</h2>
        <p class="message">
            함께 맞는 여덟 번째 봄,<br>
            서로의 따스함이 되어주려 합니다.<br>
            저희의 시작을 축복해 주세요.
        </p>
    </section>

    <section class="gallery fade-in">
        <h3 class="serif gold-text">GALLERY</h3>
        <div class="swiper gallery-swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="./assets/2.jpeg" alt="사진1"></div>
                <div class="swiper-slide"><img src="./assets/3.jpeg" alt="사진2"></div>
                <div class="swiper-slide"><img src="./assets/1.jpeg" alt="사진3"></div>
                <div class="swiper-slide"><img src="./assets/5.jpeg" alt="사진4"></div>
            </div>
            <div class="swiper-pagination"></div>
        </div>
    </section>

    <section class="account fade-in">
        <h3 class="serif">마음 전하실 곳</h3>
        
        <div class="account-box">
            <p>신랑측 계좌번호 (신한 110-123-456789)</p>
            <div class="btn-group">
                <button class="btn-copy" onclick="copyToClipboard('110123456789')">계좌 복사</button>
                <button class="btn-kakaopay" onclick="window.open('https://qr.kakaopay.com/여기에_신랑_링크_입력')">카카오페이</button>
            </div>
        </div>

        <div class="account-box">
            <p>신부측 계좌번호 (국민 987-654-321098)</p>
            <div class="btn-group">
                <button class="btn-copy" onclick="copyToClipboard('987654321098')">계좌 복사</button>
                <button class="btn-kakaopay" onclick="window.open('https://qr.kakaopay.com/FZKmTHa2M')">카카오페이</button>
            </div>
        </div>
    </section>

    <section class="share-section fade-in">
        <button class="btn-kakao-share" onclick="shareKakao()">
            <img src="https://developers.kakao.com/assets/img/about/logos/kakaotalksharing/kakaotalk_sharing_btn_small.png" alt="카카오톡 아이콘" class="kakao-icon">
            카카오톡으로 청첩장 공유하기
        </button>
    </section>

    <footer class="footer">
        <p>© 2026 Gil Dong & Mi Rae. All Rights Reserved.</p>
    </footer>

    <div id="lightbox" class="lightbox">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="./js/script.js"></script>
</body>
</html>
