<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta property="og:title" content="홍길동 ♥ 김미래 결혼식에 초대합니다">
    <meta property="og:description" content="2026년 5월 23일 토요일 오후 12시">
    <meta property="og:image" content="./assets/1.jpeg">
    
    <title>우리의 결혼식에 초대합니다</title>
    
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,500&family=Noto+Sans+KR:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <section class="intro fade-in">
        <p class="sub-title">SAVE THE DATE</p>
        <h1 class="main-names">Hong Gil Dong & Kim Mi Rae</h1>
        <div class="main-photo">
            <img src="./assets/1.jpeg" alt="메인 사진">
        </div>
        <p class="main-date">2026. 05. 23. SAT PM 12:00</p>
        <p class="main-location">그랜드 하얏트 서울, 그랜드 볼룸</p>
    </section>

    <section class="invitation fade-in">
        <div class="gold-line"></div>
        <h2 class="serif">INVITATION</h2>
        <p class="message">
            서로가 마주 보며 다져온 사랑을<br>
            이제는 한곳을 바라보며 걸어가려 합니다.<br>
            저희의 시작을 축복해 주세요.
        </p>
    </section>

    <section class="gallery fade-in">
        <h3 class="serif gold-text">GALLERY</h3>
        <div class="gallery-grid">
            <img src="./assets/2.jpeg" alt="사진1">
            <img src="./assets/3.jpeg" alt="사진2">
            <img src="./assets/4.jpeg" alt="사진3">
            <img src="./assets/5.jpeg" alt="사진4">
        </div>
    </section>

    <section class="account fade-in">
        <h3 class="serif">마음 전하실 곳</h3>
        <div class="account-box">
            <p>신랑측 계좌번호 (신한 110-123-456789)</p>
            <button onclick="copyToClipboard('110123456789')">계좌 복사하기</button>
        </div>
    </section>

    <footer class="footer">
        <p>© 2026 Gil Dong & Mi Rae. All Rights Reserved.</p>
    </footer>

    <script src="./js/script.js"></script>
</body>
</html>
